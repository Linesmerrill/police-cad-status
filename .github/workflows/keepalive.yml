# This workflow is NOT generated by Upptime — it is safe to edit.
#
# GitHub automatically disables scheduled workflows after 60 days with no
# repository activity. Upptime normally supplies that activity by committing
# uptime results, so a prolonged Upptime outage silently kills every schedule
# in this repo. This workflow commits a heartbeat on its own so the schedules
# survive even when Upptime itself is broken.

name: Keepalive CI
on:
  schedule:
    - cron: "0 12 * * 1" # Every Monday at 12:00 UTC
  workflow_dispatch:
# Deliberately NOT the shared "-upptime" concurrency group. Queueing into that
# group lets this workflow cancel a pending Upptime run (GitHub drops the older
# pending run when a newer one queues), which would drop real monitoring checks.
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-keepalive
  cancel-in-progress: false
jobs:
  keepalive:
    name: Commit heartbeat
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Write heartbeat
        run: |
          mkdir -p .github/keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive/last-run.txt
      - name: Commit and push
        run: |
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git add .github/keepalive/last-run.txt
          if git diff --cached --quiet; then
            echo "No heartbeat change to commit"
            exit 0
          fi
          git commit -m ":heartbeat: Keepalive heartbeat [skip ci]"
          git push
